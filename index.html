<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/queen-icon.svg" />
    <title>Chess To Me</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        overflow: hidden;
      }

      #splash-screen {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        z-index: 9999;
        transition: opacity 0.5s ease-out;
      }

      #splash-screen.hidden {
        opacity: 0;
        pointer-events: none;
      }

      .splash-content {
        text-align: center;
        animation: fadeIn 0.6s ease-out;
      }

      .splash-king {
        width: 180px;
        height: 180px;
        margin: 0 auto 30px;
        filter: drop-shadow(0 8px 16px rgba(0, 0, 0, 0.3));
      }

      .splash-title {
        font-size: 48px;
        font-weight: bold;
        color: white;
        letter-spacing: 2px;
        margin-bottom: 10px;
        text-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
      }

      .splash-version {
        font-size: 20px;
        color: rgba(255, 255, 255, 0.9);
        font-weight: 300;
        letter-spacing: 1px;
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: scale(0.95);
        }
        to {
          opacity: 1;
          transform: scale(1);
        }
      }
    </style>
  </head>
  <body>
    <div id="splash-screen">
      <div class="splash-content">
        <img src="./chesspieces/wikipedia/wK.png" alt="Chess King" class="splash-king" />
        <div class="splash-title">Chess To Me</div>
        <div class="splash-version">v1.0.0</div>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      window.hideSplashScreen = function() {
        const splash = document.getElementById('splash-screen');
        if (splash) {
          splash.classList.add('hidden');
          setTimeout(() => {
            splash.style.display = 'none';
          }, 500);
        }
      };
    </script>
  </body>
</html>
