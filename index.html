<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="./queen-icon.svg" />
    <title>Chess To Me</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        overflow: hidden;
      }

      #splash-screen {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        z-index: 9999;
      }

      #splash-screen.hidden {
        display: none !important;
      }

      .splash-content {
        text-align: center;
        animation: fadeIn 0.6s ease-out;
        pointer-events: none;
      }

      .splash-king {
        width: 180px;
        height: 180px;
        margin: 0 auto 30px;
        filter: drop-shadow(0 8px 16px rgba(0, 0, 0, 0.3));
      }

      .splash-title {
        font-family: 'Great Vibes', cursive;
        font-size: 72px;
        font-weight: 400;
        color: white;
        letter-spacing: 1px;
        margin-bottom: 10px;
        text-shadow:
          0 2px 4px rgba(0, 0, 0, 0.4),
          0 4px 8px rgba(0, 0, 0, 0.3),
          0 8px 16px rgba(0, 0, 0, 0.2);
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        text-rendering: optimizeLegibility;
        will-change: opacity;
        transform: translateZ(0);
        backface-visibility: hidden;
      }

      .splash-version {
        font-size: 20px;
        color: rgba(255, 255, 255, 0.9);
        font-weight: 300;
        letter-spacing: 1px;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: scale(0.95);
        }
        to {
          opacity: 1;
          transform: scale(1);
        }
      }
    </style>
  </head>
  <body>
    <div id="splash-screen">
      <div class="splash-content">
        <img src="./chesspieces/wikipedia/wK.png" alt="Chess King" class="splash-king" />
        <div class="splash-title">Chess To Me</div>
        <div class="splash-version">v1.5.0</div>
      </div>
    </div>
    <div id="root"></div>
    <script>
      window.hideSplashScreen = function() {
        console.log('[index.html] hideSplashScreen called');
        const splash = document.getElementById('splash-screen');
        if (splash) {
          console.log('[index.html] Found splash screen, adding hidden class');
          splash.classList.add('hidden');
          console.log('[index.html] Hidden class added');
        } else {
          console.warn('[index.html] Splash screen element not found');
        }
      };
      console.log('[index.html] Script loaded, hideSplashScreen function defined');
    </script>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
