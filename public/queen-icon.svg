<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#1c2840"/>
      <stop offset="100%" stop-color="#080e1a"/>
    </linearGradient>
    <linearGradient id="gv" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#ffe566"/>
      <stop offset="45%"  stop-color="#c8920a"/>
      <stop offset="100%" stop-color="#7a4e00"/>
    </linearGradient>
    <linearGradient id="base" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#d4a010"/>
      <stop offset="100%" stop-color="#6a3e00"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="256" height="256" rx="44" fill="url(#bg)"/>
  <!-- Subtle gold rim -->
  <rect x="2" y="2" width="252" height="252" rx="43" fill="none"
        stroke="#c8920a" stroke-width="2.5" stroke-opacity="0.28"/>

  <!-- Crown arch body (4 scalloped valleys between 5 stalks) -->
  <path d="
    M  24 196
    L  24 156
    Q  40 122  60 112
    Q  46  92  38  62
    Q  52  74  64  90
    Q  74  68  90  52
    Q  96  68 104  84
    Q 112  58 128  48
    Q 144  58 152  84
    Q 160  68 166  52
    Q 182  68 192  90
    Q 204  74 218  62
    Q 210  92 196 112
    Q 216 122 232 156
    L 232 196
    Z
  " fill="url(#gv)"/>

  <!-- Crown top edge glint -->
  <path d="M 60 112 Q 94 88 128 80 Q 162 88 196 112"
        fill="none" stroke="#ffe566" stroke-width="3"
        stroke-opacity="0.3" stroke-linecap="round"/>

  <!-- Base platform -->
  <rect x="20" y="196" width="216" height="30" rx="5" fill="url(#base)"/>
  <!-- Base top highlight -->
  <rect x="20" y="196" width="216" height="6" rx="3" fill="#ffe566" opacity="0.32"/>
  <!-- Base bottom shadow -->
  <rect x="20" y="220" width="216" height="6" rx="3" fill="#2a1400" opacity="0.55"/>

  <!-- 5 balls -->
  <circle cx="40"  cy="58" r="20" fill="url(#gv)"/>
  <circle cx="82"  cy="42" r="18" fill="url(#gv)"/>
  <circle cx="128" cy="34" r="22" fill="url(#gv)"/>
  <circle cx="174" cy="42" r="18" fill="url(#gv)"/>
  <circle cx="216" cy="58" r="20" fill="url(#gv)"/>

  <!-- Specular highlights on balls -->
  <circle cx="31"  cy="48" r="8"  fill="white" opacity="0.48"/>
  <circle cx="73"  cy="32" r="7"  fill="white" opacity="0.48"/>
  <circle cx="118" cy="24" r="9"  fill="white" opacity="0.48"/>
  <circle cx="165" cy="32" r="7"  fill="white" opacity="0.48"/>
  <circle cx="207" cy="48" r="8"  fill="white" opacity="0.48"/>
</svg>
