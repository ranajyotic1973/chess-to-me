name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  # ─── Guard: only run when the tag points to a commit on main ────────────────
  check-branch:
    name: Verify tag is on main
    runs-on: ubuntu-latest
    outputs:
      on-main: ${{ steps.check.outputs.on-main }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Check commit is reachable from main
        id: check
        run: |
          git fetch origin main
          if git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "on-main=true" >> "$GITHUB_OUTPUT"
          else
            echo "on-main=false" >> "$GITHUB_OUTPUT"
            echo "::error::Tag $GITHUB_REF_NAME does not point to a commit on main. Release blocked."
            exit 1
          fi

  # ─── Windows: x64 + arm64 NSIS installers ──────────────────────────────────
  build-windows:
    name: Build Windows
    needs: check-branch
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Rebuild native modules (x64)
        run: npm run rebuild:native

      - name: Build Windows x64
        run: npm run build && npx electron-builder --win --x64 --publish never

      - name: Rebuild native modules (arm64)
        run: npm run rebuild:native:arm64

      - name: Build Windows arm64
        run: npx electron-builder --win --arm64 --publish never

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-installers
          path: release/*.exe
          if-no-files-found: error

  # ─── macOS: universal DMG (x64 + arm64 fat binary) ─────────────────────────
  build-mac:
    name: Build macOS
    needs: check-branch
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Rebuild native modules
        run: npm run rebuild:native

      - name: Build macOS universal DMG
        run: npm run build && npx electron-builder --mac --universal --publish never

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mac-installers
          path: release/*.dmg
          if-no-files-found: error

  # ─── Linux x64: AppImage + deb ──────────────────────────────────────────────
  build-linux-x64:
    name: Build Linux x64
    needs: check-branch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libnotify-dev libnss3 libxss1 libxtst6

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Rebuild native modules (x64)
        run: npm run rebuild:native

      - name: Build Linux x64
        run: npm run build && npx electron-builder --linux --x64 --publish never

      - name: Normalize Linux x64 arch names
        run: |
          for f in release/*x86_64*; do [ -f "$f" ] && mv "$f" "${f/x86_64/x64}"; done
          for f in release/*amd64*;  do [ -f "$f" ] && mv "$f" "${f/amd64/x64}";  done

      - name: Upload Linux x64 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-x64-installers
          path: |
            release/*.AppImage
            release/*.deb
          if-no-files-found: error

  # ─── Linux arm64: AppImage + deb (via QEMU) ─────────────────────────────────
  build-linux-arm64:
    name: Build Linux arm64
    needs: check-branch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libnotify-dev libnss3 libxss1 libxtst6

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Rebuild native modules (arm64)
        run: npm run rebuild:native:arm64

      - name: Build Linux arm64
        run: npm run build && npx electron-builder --linux --arm64 --publish never

      - name: Upload Linux arm64 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-arm64-installers
          path: |
            release/*arm64*.AppImage
            release/*arm64*.deb
          if-no-files-found: error

  # ─── Create GitHub Release with all artifacts ───────────────────────────────
  create-release:
    name: Create Release
    needs: [check-branch, build-windows, build-mac, build-linux-x64, build-linux-arm64]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download Windows installers
        uses: actions/download-artifact@v4
        with:
          name: windows-installers
          path: dist-release/

      - name: Download macOS installers
        uses: actions/download-artifact@v4
        with:
          name: mac-installers
          path: dist-release/

      - name: Download Linux x64 installers
        uses: actions/download-artifact@v4
        with:
          name: linux-x64-installers
          path: dist-release/

      - name: Download Linux arm64 installers
        uses: actions/download-artifact@v4
        with:
          name: linux-arm64-installers
          path: dist-release/

      - name: List release artifacts
        run: ls -lh dist-release/

      - name: Generate release notes
        run: |
          TAG="${{ github.ref_name }}"
          REPO="${{ github.repository }}"
          BASE="https://github.com/${REPO}/releases/download/${TAG}"

          cat > release-notes.md << NOTES
          ## Chess To Me ${TAG}

          ### Downloads

          | Platform | Architecture | File |
          |----------|--------------|------|
          | Windows  | x64          | [chess-to-me-win-x64.exe](${BASE}/chess-to-me-win-x64.exe) |
          | Windows  | arm64        | [chess-to-me-win-arm64.exe](${BASE}/chess-to-me-win-arm64.exe) |
          | macOS    | Universal (Intel + Apple Silicon) | [chess-to-me-mac-universal.dmg](${BASE}/chess-to-me-mac-universal.dmg) |
          | Linux    | x64 AppImage | [chess-to-me-linux-x64.AppImage](${BASE}/chess-to-me-linux-x64.AppImage) |
          | Linux    | x64 .deb     | [chess-to-me-linux-x64.deb](${BASE}/chess-to-me-linux-x64.deb) |
          | Linux    | arm64 AppImage | [chess-to-me-linux-arm64.AppImage](${BASE}/chess-to-me-linux-arm64.AppImage) |
          | Linux    | arm64 .deb   | [chess-to-me-linux-arm64.deb](${BASE}/chess-to-me-linux-arm64.deb) |

          > **Windows:** SmartScreen warning? Click **More info → Run anyway**. See [README](https://github.com/${REPO}#security-warnings-on-windows-and-macos).
          > **macOS:** Gatekeeper warning? Right-click the .dmg → **Open** → **Open**.

          NOTES

          # Append commits since the previous release tag
          PREV_TAG=$(git tag --sort=-version:refname | grep -v "^${TAG}$" | head -1)
          if [ -n "$PREV_TAG" ]; then
            CHANGELOG=$(git log --pretty=format:"- %s" "${PREV_TAG}..HEAD" 2>/dev/null)
            if [ -n "$CHANGELOG" ]; then
              printf '\n### What'\''s Changed\n\n%s\n\n**Full diff:** https://github.com/%s/compare/%s...%s\n' \
                "$CHANGELOG" "$REPO" "$PREV_TAG" "$TAG" >> release-notes.md
            fi
          fi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          name: Chess To Me ${{ github.ref_name }}
          body_path: release-notes.md
          files: |
            dist-release/*.exe
            dist-release/*.dmg
            dist-release/*.AppImage
            dist-release/*.deb
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
